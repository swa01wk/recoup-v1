      - viewer
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostExplorerEstimate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /connections/{connection_id}/tests:
    post:
      operationId: startConnectionTest
      summary: Run the connection test (async; poll the result)
      tags:
      - Connections
      x-requirements:
      - R-09
      - NFR-10
      x-milestone: M1
      x-roles:
      - approver
      - contributor
      security:
      - session: []
        csrf: []
      parameters:
      - $ref: '#/components/parameters/ConnectionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
