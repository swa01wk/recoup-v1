# Recoup API contract. Generated once in Stage 2a; from now on edit this file directly, in a spec PR.
# Contract version: info.version. Rules: docs/contracts/README.md.
openapi: 3.1.0
info:
  title: Recoup API
  version: 0.1.0
  description: 'Contract for Recoup v1 (Stage 2a, 2026-11-27). Versioning rules: docs/contracts/README.md.


    Extensions: x-requirements (R-xx served), x-milestone (M0/M1/M2), x-roles (tenant roles allowed; ''operator'' = the P-06 pool). Authorisation
    is enforced server-side by the control plane, never by the UI.


    Every amount is a Money object with stage and source (R-02). State-changing commands need Idempotency-Key, and session requests need the X-Recoup-CSRF
    header (ADR-017).'
servers:
- url: /api/v1
tags:
- name: Free check
- name: Auth
- name: Tenancy
- name: Connections
- name: Incidents
- name: Reports
- name: Claims
- name: Evidence
- name: Packets
- name: Approvals
- name: Cases
- name: Reconciliation
- name: Ledger
- name: Deadlines
- name: Operator
paths:
  /catalog/options:
    get:
      operationId: getCatalogOptions
      summary: Regions, services and spend bands for the no-access check
      tags:
      - Free check
      x-requirements:
      - R-33
      x-milestone: M1
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOptions'
  /estimates:
    post:
      operationId: createEstimate
      summary: Run the no-access check
      tags:
      - Free check
      x-requirements:
      - R-33
      - R-34
      x-milestone: M1
      description: Anonymous. Sets or reads the first-party anonymous session cookie (ADR-017 §5).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /estimates/{estimate_id}:
    get:
      operationId: getEstimate
      summary: Get a no-access check result
      tags:
      - Free check
      x-requirements:
      - R-34
      x-milestone: M1
      security: []
      parameters:
      - name: estimate_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /funnel-events:
    post:
      operationId: recordFunnelEvent
      summary: Record a next-step choice
      tags:
      - Free check
      x-requirements:
      - R-35
      - KPI-03
      x-milestone: M1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelEventRequest'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /role-template/permissions:
    get:
      operationId: getRolePermissions
      summary: The exact permission list of the current read-only role template
      tags:
      - Connections
      x-requirements:
      - R-07
      - US-02
      x-milestone: M1
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
  /auth/login:
    get:
      operationId: login
      summary: Start sign-in (OIDC authorisation code + PKCE)
      tags:
      - Auth
      x-requirements:
      - R-56
      x-milestone: M0
      security: []
      parameters:
      - name: pool
        in: query
        required: true
        schema:
          enum:
          - customer
          - operator
      responses:
        '302':
          description: Redirect to Cognito managed login (ADR-017).
  /auth/callback:
    get:
      operationId: authCallback
      summary: OIDC callback; sets the session cookie
      tags:
      - Auth
      x-requirements:
      - R-56
      x-milestone: M0
      security: []
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect into the app with a session cookie.
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out and revoke the session
      tags:
      - Auth
      x-requirements:
      - R-56
      x-milestone: M0
      x-roles:
      - approver
      - contributor
      - viewer
      security:
      - session: []
        csrf: []
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me:
    get:
      operationId: getMe
      summary: Current user, memberships and CSRF token
      tags:
      - Auth
      x-requirements:
      - R-56
      x-milestone: M0
      x-roles:
      - approver
      - contributor
      - viewer
      security:
      - session: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me/current-tenant:
    put:
      operationId: setCurrentTenant
      summary: Switch the session's tenant
      tags:
      - Auth
      x-requirements:
      - R-56
      x-milestone: M0
      x-roles:
      - approver
      - contributor
      - viewer
      security:
      - session: []
        csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant_id:
                  type: string
                  format: uuid
              required:
              - tenant_id
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants:
    post:
      operationId: createTenant
      summary: Create a tenant; the creator becomes its approver (A-36)
      tags:
      - Tenancy
      x-requirements:
      - R-56
      x-milestone: M1
      x-roles: []
      security:
      - session: []
        csrf: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /tenant:
    get:
      operationId: getTenant
      summary: Current tenant
      tags:
      - Tenancy
      x-requirements:
      - R-56
      x-milestone: M1
      x-roles:
      - approver
      - contributor
      - viewer
      security:
      - session: []
      responses:
        '200':
          description: OK
          content:
