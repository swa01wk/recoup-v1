              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /tenant/members:
    get:
      operationId: listMembers
      summary: List members
      tags:
      - Tenancy
      x-requirements:
      - R-56
      x-milestone: M1
      x-roles:
      - approver
      - contributor
      - viewer
      security:
      - session: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /tenant/members/{sub}:
    patch:
      operationId: changeMemberRole
      summary: 'Change a member''s role (A-36: approvers only)'
      tags:
      - Tenancy
      x-requirements:
      - R-56
      x-milestone: M1
      x-roles:
      - approver
      security:
      - session: []
        csrf: []
      parameters:
      - name: sub
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: removeMember
      summary: Remove a member; revokes their sessions
      tags:
      - Tenancy
      x-requirements:
      - R-56
      x-milestone: M1
      x-roles:
      - approver
      security:
      - session: []
        csrf: []
      parameters:
      - name: sub
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenant/invitations:
    post:
      operationId: inviteMember
      summary: Invite a member by email (A-36)
      tags:
