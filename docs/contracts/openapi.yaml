  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation after signing in
      tags:
      - Tenancy
      x-requirements:
      - R-56
      x-milestone: M1
      x-roles: []
      security:
      - session: []
        csrf: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
