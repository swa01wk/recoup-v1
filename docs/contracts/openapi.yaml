    post:
      operationId: opsCreatePublicIncident
      summary: Enter a pre-capture public incident
      tags:
      - Operator
      x-requirements:
      - ADR-021
      - Q-15
      x-milestone: M1
      x-roles:
      - operator
      security:
      - opsSession: []
        csrf: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicIncidentCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIncident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ops/sla-reviews:
    get:
      operationId: opsListSlaReviews
      summary: SLA recheck reviews
      tags:
      - Operator
      x-requirements:
      - R-17
      - US-16
      x-milestone: M1
      x-roles:
      - operator
      security:
      - opsSession: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlaReview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ops/sla-reviews/{review_id}/dismiss:
    post:
      operationId: opsDismissSlaReview
      summary: Dismiss a review (publishing a new version happens by PR)
      tags:
      - Operator
      x-requirements:
      - R-17
      - US-16
      x-milestone: M1
      x-roles:
      - operator
      security:
      - opsSession: []
        csrf: []
      parameters:
      - name: review_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 1
              required:
              - reason
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /ops/tenants/{tenant_id}/entitlement:
    put:
      operationId: opsSetEntitlement
      summary: Set a tenant's pilot agreement flag
      tags:
      - Operator
      x-requirements:
      - R-55
      x-milestone: M1
      x-roles:
      - operator
      security:
      - opsSession: []
        csrf: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntitlementUpdate'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: recoup_session
      description: HttpOnly session cookie from the customer pool (ADR-017 §3).
    opsSession:
      type: apiKey
      in: cookie
      name: recoup_ops_session
      description: Operator pool session (ADR-017 §1).
    csrf:
      type: apiKey
      in: header
      name: X-Recoup-CSRF
      description: Must match the session's CSRF token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Required on every state-changing command. A repeat returns the first result (C01).
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: No valid session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role or MFA requirement not met; audited (R-38).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, or belongs to another tenant (never distinguished; C07).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: stage_conflict, stale_version, guard_failed or idempotency_conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many anonymous requests (WAF, ADR-023 §2).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
          description: USD amount as a decimal string with two places (NFR-03). Never a JSON number.
        currency:
          const: USD
        stage:
          enum:
          - estimate
          - approved
          - submitted
          - granted
          - posted
          - refunded_outside_bill
          description: R-02. Only 'posted' is verified money (ADR-004).
        source:
          enum:
          - calculation
          - cost_explorer
          - cur2
          - customer_entered
          description: Where the number comes from (R-02).
        basis_source:
          enum:
          - cost_explorer
          - cur2
          description: 'For source=calculation: what the billed charges behind it came from (R-25).'
        verified:
          type: boolean
          description: True only for stage=posted (R-48).
      required:
      - amount
      - currency
      - stage
      - source
      - verified
      description: Every dollar in the API is a Money object. A bare number is a contract-test failure (R-02).
    MoneyRange:
      type: object
      additionalProperties: false
      properties:
        low:
          $ref: '#/components/schemas/Money'
        high:
          $ref: '#/components/schemas/Money'
        assumptions:
          type: array
          items:
            type: string
      required:
      - low
      - high
      - assumptions
      description: Estimator range (R-34). Both ends are stage=estimate, source=calculation.
    StageTotal:
      type: object
      additionalProperties: false
      properties:
        stage:
          enum:
          - estimate
          - approved
          - submitted
          - granted
          - posted
          - refunded_outside_bill
        total:
          $ref: '#/components/schemas/Money'
        claim_count:
          type: integer
          minimum: 0
      required:
      - stage
      - total
      - claim_count
      description: One total per stage; never across stages (R-03).
    BilledCharge:
      type: object
      additionalProperties: false
      properties:
        billing_period:
          type: string
          format: date
        product_code:
          type: string
        region:
          type: string
        amount:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
          description: USD amount as a decimal string with two places (NFR-03). Never a JSON number.
        currency:
          const: USD
        source:
          enum:
          - cost_explorer
          - cur2
        label:
          enum:
          - estimate, source Cost Explorer
          - billed, source CUR 2.0
          description: 'R-25: Cost Explorer charges are estimates and never count toward posted.'
      required:
      - billing_period
      - product_code
      - region
      - amount
      - currency
      - source
      - label
    AwsApiCost:
      type: object
      additionalProperties: false
      properties:
        calls:
          type: integer
          minimum: 0
        unit_price_usd:
          type: string
        total_usd:
          type: string
        billed_to:
          const: customer_aws_account
        label:
          const: AWS charge to your account (estimate)
      required:
      - calls
      - unit_price_usd
      - total_usd
      - billed_to
      - label
      description: Cost Explorer API calls the first report will make (R-10, ADR-009 §4). Not a claim amount.
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          enum:
          - validation_failed
          - not_authenticated
          - mfa_required
          - forbidden_role
          - not_found
          - stage_conflict
          - stale_version
          - guard_failed
          - idempotency_conflict
          - approval_invalid
          - deadline_passed
          - upload_rejected
          - aws_access_denied
          - aws_unavailable
          - health_api_not_on_plan
          - cur_export_missing
          - rate_limited
          - internal
          description: Typed failure (R-05). The UI picks its repair action from this.
        detail:
          type: string
        instance:
          type: string
        trace_id:
          type: string
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - type
      - title
      - status
      - code
      description: RFC 9457 problem details.
    PageInfo:
      type: object
      additionalProperties: false
      properties:
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - next_cursor
    CatalogOptions:
      type: object
      additionalProperties: false
      properties:
        regions:
          type: array
          items:
            type: string
          description: Regions with Health capture (ADR-021 §1).
        services:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              contract_id:
                type: string
              service_name:
                type: string
            required:
            - contract_id
            - service_name
        spend_bands:
          type: array
          items:
            enum:
            - under_1k
            - 1k_10k
            - 10k_50k
            - 50k_250k
            - over_250k
        capture_started_at:
          type: string
          format: date-time
      required:
      - regions
      - services
      - spend_bands
      - capture_started_at
    EstimateRequest:
      type: object
      additionalProperties: false
      properties:
        regions:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 30
        services:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              contract_id:
                type: string
              monthly_spend_band:
                enum:
                - under_1k
                - 1k_10k
                - 10k_50k
                - 50k_250k
                - over_250k
            required:
            - contract_id
            - monthly_spend_band
          minItems: 1
          maxItems: 10
      required:
      - regions
      - services
      description: R-33. No AWS access and no contact details (Q-31).
    EstimateIncident:
      type: object
      additionalProperties: false
      properties:
        public_incident_id:
          type: string
          format: uuid
        service_name:
          type: string
        contract_id:
          type: string
        region:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        source:
          enum:
          - eventbridge
          - health_api
          - operator_entered
        source_label:
          type: string
          description: e.g. 'AWS Health event (captured by Recoup)' or 'entered by Recoup from the AWS Health Dashboard'.
        event_arn:
          oneOf:
          - type: string
          - type: 'null'
        deadline_earlier:
          type: string
          format: date
        deadline_later:
          type: string
          format: date
        range:
          $ref: '#/components/schemas/MoneyRange'
      required:
      - public_incident_id
      - service_name
      - contract_id
      - region
      - start_time
      - end_time
      - source
      - source_label
      - event_arn
      - deadline_earlier
      - deadline_later
      - range
    EstimateResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        claim_window:
          $ref: '#/components/schemas/DateRange'
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/EstimateIncident'
        history_note:
          type: string
          description: States when Recoup's capture started and how earlier incidents were sourced.
      required:
      - id
      - generated_at
      - claim_window
      - incidents
      - history_note
    DateRange:
      type: object
      additionalProperties: false
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
      required:
      - start
      - end
    TimeWindow:
      type: object
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      required:
      - start
      - end
    FunnelEventRequest:
      type: object
      additionalProperties: false
      properties:
        event_type:
          enum:
          - book_interview_clicked
          - connect_clicked
        estimate_id:
          type: string
          format: uuid
      required:
      - event_type
    Me:
      type: object
      additionalProperties: false
      properties:
        sub:
          type: string
        email:
          type: string
          format: email
        pool:
          enum:
          - customer
          - operator
        mfa_at:
          type: string
          format: date-time
        current_tenant_id:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        memberships:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              tenant_id:
                type: string
                format: uuid
              tenant_name:
                type: string
              role:
                enum:
                - approver
                - contributor
                - viewer
            required:
            - tenant_id
            - tenant_name
            - role
        csrf_token:
          type: string
          description: Send back in X-Recoup-CSRF on every state-changing request (ADR-017 §3).
      required:
      - sub
      - email
      - pool
      - mfa_at
      - current_tenant_id
      - memberships
      - csrf_token
    TenantCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        anon_session_id:
          type: string
          format: uuid
      required:
      - name
    Tenant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          enum:
          - active
          - exiting
          - deleted
        pilot_agreement:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - status
      - pilot_agreement
      - created_at
    Member:
      type: object
      additionalProperties: false
      properties:
        sub:
          type: string
        email:
          type: string
          format: email
        role:
          enum:
          - approver
          - contributor
          - viewer
        status:
          enum:
          - invited
          - active
          - removed
      required:
      - sub
      - email
      - role
      - status
    InvitationCreate:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        role:
          enum:
          - approver
          - contributor
          - viewer
      required:
      - email
      - role
    Invitation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          enum:
          - approver
          - contributor
          - viewer
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - role
      - expires_at
    RoleChange:
      type: object
      additionalProperties: false
      properties:
        role:
          enum:
          - approver
          - contributor
          - viewer
      required:
      - role
    PermissionStatement:
      type: object
      additionalProperties: false
      properties:
        effect:
          enum:
          - Allow
          - Deny
        actions:
          type: array
          items:
            type: string
        not_actions:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
        purpose:
          type: string
      required:
      - effect
      - resources
      - purpose
    PermissionList:
      type: object
      additionalProperties: false
      properties:
        template_version:
          type: string
        template_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        template_url:
          type: string
          format: uri
        statements:
          type: array
          items:
            $ref: '#/components/schemas/PermissionStatement'
      required:
      - template_version
      - template_sha256
      - template_url
      - statements
      description: R-07. The list itself is owned by SECURITY.md; this endpoint serves it from the published template.
    DiscoveryAnswers:
      type: object
      additionalProperties: false
      properties:
        seller:
          enum:
          - aws_inc
          - aws_india
          - reseller
          - unknown
          description: Who sells you AWS (Q-05, Q-20).
        support_plan:
          enum:
          - basic
          - developer
          - business_classic
          - enterprise_on_ramp
          - enterprise_classic
          - business_support_plus
          - enterprise_support
          - unified_operations
          - unknown
          description: Q-04, NFR-10.
        log_retention:
          enum:
          - under_30_days
          - 30_to_90_days
          - over_90_days
          - not_kept
          - unknown
          description: Q-08.
      required:
      - seller
      - support_plan
      - log_retention
      description: Recorded at connection (ADR-014 §3).
    ConnectionCreate:
      type: object
      additionalProperties: false
      properties:
        aws_account_id:
          type: string
          pattern: ^[0-9]{12}$
        discovery:
          $ref: '#/components/schemas/DiscoveryAnswers'
      required:
      - aws_account_id
      - discovery
    CurExport:
      type: object
      additionalProperties: false
      properties:
        bucket:
          type: string
          minLength: 3
          maxLength: 63
        prefix:
          type: string
        region:
          type: string
        create_with_template:
          type: boolean
          description: Template creates the export and bucket (ADR-019 §2).
      required:
      - bucket
      - prefix
      - region
      - create_with_template
    Connection:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        aws_account_id:
          type: string
          pattern: ^[0-9]{12}$
        status:
          enum:
          - pending_deploy
          - testing
          - connected
          - failed
          - disconnected
        external_id:
          type: string
          description: Generated by Recoup, unique per connection (NFR-02). Visible to the tenant; never reused.
        template:
          type: object
          additionalProperties: false
          properties:
            version:
              type: string
            sha256:
              type: string
            quick_create_url:
              type: string
              format: uri
          required:
          - version
          - sha256
          - quick_create_url
        cur_export:
          oneOf:
          - $ref: '#/components/schemas/CurExport'
          - type: 'null'
        discovery:
          $ref: '#/components/schemas/DiscoveryAnswers'
        detected:
          type: object
          additionalProperties: false
          properties:
            legal_entity:
              oneOf:
              - type: string
              - type: 'null'
            health_api_available:
              oneOf:
              - type: boolean
              - type: 'null'
            supported:
              type: boolean
            unsupported_reason:
              oneOf:
              - enum:
                - aispl_seller
                - reseller
                - non_usd
              - type: 'null'
          required:
          - legal_entity
          - health_api_available
          - supported
          - unsupported_reason
        created_at:
          type: string
          format: date-time
        disconnected_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        disconnect_reason:
          oneOf:
          - enum:
            - assume_role_denied
            - customer_request
            - tenant_exit
          - type: 'null'
      required:
      - id
      - aws_account_id
      - status
      - external_id
      - template
      - cur_export
      - discovery
      - detected
      - created_at
      - disconnected_at
      - disconnect_reason
    CostExplorerEstimate:
      type: object
      additionalProperties: false
      properties:
        claim_window:
          $ref: '#/components/schemas/DateRange'
        services:
          type: array
          items:
            type: string
        regions:
          type: array
          items:
            type: string
        cost:
          $ref: '#/components/schemas/AwsApiCost'
      required:
      - claim_window
      - services
      - regions
      - cost
    ConnectionCheck:
      type: object
      additionalProperties: false
      properties:
        check:
          enum:
          - assume_role
          - cur_read
          - cost_explorer
          - health_api
        outcome:
          enum:
          - pass
          - fail
          - unavailable
        reason_code:
          oneOf:
          - enum:
            - access_denied
            - external_id_mismatch
            - subscription_required
            - bucket_not_found
            - no_export_data
            - throttled
            - unknown
          - type: 'null'
        detail:
          type: string
      required:
      - check
      - outcome
      - reason_code
      - detail
    ConnectionTest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        status:
          enum:
          - queued
          - running
          - completed
        started_at:
          type: string
          format: date-time
        finished_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionCheck'
        fallback_offered:
          type: boolean
          description: True when Health isn't available on the plan (R-09, R-14).
      required:
      - id
      - connection_id
      - status
      - started_at
      - finished_at
      - checks
      - fallback_offered
    CustomerIncidentCreate:
      type: object
      additionalProperties: false
      properties:
        contract_id:
          type: string
        region:
          type: string
        window:
          $ref: '#/components/schemas/TimeWindow'
        source_note:
          type: string
          maxLength: 2000
      required:
      - contract_id
      - region
      - window
      description: R-14. Labelled customer-supplied everywhere.
    CustomerIncident:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        contract_id:
          type: string
        region:
          type: string
        window:
          $ref: '#/components/schemas/TimeWindow'
        label:
          const: customer-supplied
        entered_by:
          type: string
        entered_at:
          type: string
          format: date-time
      required:
