  /tenant/exit:
    post:
      operationId: requestTenantExit
      summary: 'Leave Recoup: stop all reads and schedule deletion'
      tags:
      - Tenancy
      x-requirements:
      - R-53
      - US-15
      x-milestone: M1
      x-roles:
      - approver
      security:
      - session: []
        csrf: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                confirm:
                  const: true
              required:
              - confirm
      responses:
        '202':
          description: Accepted; deletion follows Q-27.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /connections:
    get:
      operationId: listConnections
      summary: List AWS account connections
      tags:
      - Connections
      x-requirements:
      - R-06
      - R-11
      x-milestone: M1
      x-roles:
      - approver
      - contributor
      - viewer
      security:
      - session: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createConnection
      summary: 'Create a connection: generates the ExternalId and the template link'
      tags:
      - Connections
      x-requirements:
      - R-06
      - NFR-02
      x-milestone: M1
      x-roles:
      - approver
      - contributor
      security:
      - session: []
        csrf: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
