      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /connections/{connection_id}:
    get:
      operationId: getConnection
      summary: Get a connection
      tags:
      - Connections
      x-requirements:
      - R-06
      - R-11
      x-milestone: M1
      x-roles:
      - approver
      - contributor
      - viewer
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /connections/{connection_id}/discovery:
    put:
      operationId: setDiscoveryAnswers
      summary: Record seller, support plan and log retention
      tags:
      - Connections
      x-requirements:
      - ADR-014
      x-milestone: M1
      x-roles:
      - approver
      - contributor
      security:
      - session: []
        csrf: []
      parameters:
      - $ref: '#/components/parameters/ConnectionId'
