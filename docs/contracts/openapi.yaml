  /reports/{report_id}:
    get:
      operationId: getReport
      summary: Get a report
      tags:
      - Reports
      x-requirements:
      - R-55
      - R-03
      - R-27
      x-milestone: M1
      x-roles:
      - approver
      - contributor
      - viewer
